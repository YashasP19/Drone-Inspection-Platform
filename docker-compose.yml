services:
  # 1. Reverse Proxy + React Vite SPA
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: drone_frontend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - drone_network

  # 2. Node.js Express Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: drone_backend
    restart: unless-stopped
    environment:
      - PORT=5001
      - NODE_ENV=production
      - PYTHON_SERVICE_URL=http://ai-service:8000
      - DB_FILE=/app/data/db.json
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_DRIVE_API_KEY=${GOOGLE_DRIVE_API_KEY}
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/data
    depends_on:
      - ai-service
    networks:
      - drone_network

  # 3. Python FastAPI LangGraph & YOLO Multi-Agent Service
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: drone_ai_service
    restart: unless-stopped
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - YOLO_MODEL_PATH=models/crack_pretrained.pt
    volumes:
      - uploads_data:/app/uploads
    networks:
      - drone_network

volumes:
  uploads_data:
    name: drone_uploads_data
  db_data:
    name: drone_db_data

networks:
  drone_network:
    name: drone_inspection_net
    driver: bridge
